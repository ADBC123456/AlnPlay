name: Release

# Publishing a release is just tagging: `git tag v0.1.0 && git push origin v0.1.0`.
# This workflow builds Android APKs only, then creates an AlnPlay GitHub
# Release on version tags. iOS distribution stays in the signed/manual flow.
# (No AAB — Play Store publishing isn't set up yet.)
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Build Android APKs
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable

      - name: Fetch dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Build universal release APK
        run: flutter build apk --release --dart-define=TMDB_API_KEY=${{ secrets.TMDB_API_KEY }} --dart-define=OPENSUBTITLES_API_KEY=${{ secrets.OPENSUBTITLES_API_KEY }} --dart-define=SIMKL_CLIENT_ID=${{ secrets.SIMKL_CLIENT_ID }}

      - name: Build split-per-abi release APKs
        run: flutter build apk --release --split-per-abi --dart-define=TMDB_API_KEY=${{ secrets.TMDB_API_KEY }} --dart-define=OPENSUBTITLES_API_KEY=${{ secrets.OPENSUBTITLES_API_KEY }} --dart-define=SIMKL_CLIENT_ID=${{ secrets.SIMKL_CLIENT_ID }}

      - name: Rename artifacts with app name and version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cd build/app/outputs/flutter-apk
          mv app-release.apk "AlnPlay-${VERSION}-universal.apk"
          mv app-arm64-v8a-release.apk "AlnPlay-${VERSION}-arm64-v8a.apk"
          mv app-armeabi-v7a-release.apk "AlnPlay-${VERSION}-armeabi-v7a.apk"
          mv app-x86_64-release.apk "AlnPlay-${VERSION}-x86_64.apk"

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AlnPlay-android
          path: |
            build/app/outputs/flutter-apk/AlnPlay-*.apk

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Build release body (changelog entry + install guide)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            $0 ~ "^## " ver "$" { insec=1; next }
            insec && /^## / { exit }
            insec { print }
          ' CHANGELOG.md > /tmp/changelog-entry.md
          {
            echo "## What's new in AlnPlay $VERSION"
            echo
            cat /tmp/changelog-entry.md
            echo
            cat .github/release_notes.md
          } > /tmp/release-body.md
          echo "BODY=/tmp/release-body.md" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: ${{ env.BODY }}
          generate_release_notes: true
          files: |
            artifacts/AlnPlay-android/**/*.apk
